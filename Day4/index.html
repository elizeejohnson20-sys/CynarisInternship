<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Responsive Grocery Store</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header class="header">

        <nav class="navbar">

            <h1 class="logo">LocalGrocer</h1>

            <div class="nav-links">
                <a href="#">Home</a>
                <a href="#">Products</a>
                <a href="#">Cart</a>
            </div>

        </nav>

    </header>

    <main>

        <section class="hero">

            <h2>Fresh Groceries Delivered</h2>

            <p>
                Shop fresh products from your neighbourhood grocery store.
            </p>

            <button>Shop Now</button>

        </section>

        <section class="products-section">

            <h2>Popular Products</h2>

            <div class="products">

                <article class="product-card">
                    <h3>Fresh Apples</h3>
                    <p>₹120 per kg</p>
                    <button>Add to Cart</button>
                </article>

                <article class="product-card">
                    <h3>Organic Milk</h3>
                    <p>₹60 per litre</p>
                    <button>Add to Cart</button>
                </article>

                <article class="product-card">
                    <h3>Fresh Bread</h3>
                    <p>₹45 per pack</p>
                    <button>Add to Cart</button>
                </article>

            </div>

        </section>

    </main>

    <footer class="footer">

        <p>© 2026 LocalGrocer</p>

    </footer>

</body>
</html>
